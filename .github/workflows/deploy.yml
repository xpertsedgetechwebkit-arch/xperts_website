name: WordPress CMS Auto Deploy to EC2

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Test WordPress monitoring
        run: node --test tests/*.test.mjs

      - name: Restore last verified CMS deployment snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p monitor-state/previous

          ARTIFACT_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=xpertsedge-wp-ec2-deployed-snapshot&per_page=100" \
            --jq '([.artifacts[] | select(.expired == false)] | max_by(.created_at) | .id) // ""')"

          if [ -n "$ARTIFACT_ID" ]; then
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
              > previous.zip

            unzip -j previous.zip snapshot.json \
              -d monitor-state/previous
          else
            echo "No deployment baseline; first run will deploy."
          fi

      - name: Compare WordPress content
        id: compare
        run: |
          node scripts/wordpress-monitor-state.mjs \
            --previous monitor-state/previous/snapshot.json \
            --output monitor-state/snapshot.json

      - name: Build updated website
        if: steps.compare.outputs.build_required == 'true'
        env:
          NEXT_PUBLIC_LEADS_DB_ENABLED: 'true'
          NEXT_PUBLIC_LEADS_API_URL: '/api/leads'
        shell: bash
        run: |
          set -euo pipefail

          npx --yes pnpm@10 install --frozen-lockfile
          npx --yes pnpm@10 exec tsc --noEmit
          npx --yes pnpm@10 build

          test -s out/index.html
          test -s out/blog.html

      - name: Check content stayed stable during build
        if: steps.compare.outputs.build_required == 'true'
        id: stable
        shell: bash
        run: |
          set -euo pipefail

          node scripts/wordpress-monitor-state.mjs \
            --previous monitor-state/snapshot.json \
            --output monitor-state/after-build.json

          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';

          const before = JSON.parse(
            readFileSync('monitor-state/snapshot.json', 'utf8')
          );
          const after = JSON.parse(
            readFileSync('monitor-state/after-build.json', 'utf8')
          );

          if (before.sha256 !== after.sha256) {
            throw new Error(
              'WordPress changed during the build. Next scheduled run will retry.'
            );
          }
          JS

      - name: Package website
        if: steps.compare.outputs.build_required == 'true'
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "$GITHUB_SHA" > out/deployment.txt

          node -e \
            "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('monitor-state/snapshot.json','utf8')); fs.writeFileSync('out/cms-content.txt',s.sha256+'\n')"

          tar -czf website.tar.gz -C out .

      - name: Authenticate to AWS
        if: steps.compare.outputs.build_required == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::429552190319:role/XpertsEdgeGitHubEC2DeployRole
          aws-region: ap-south-1
          role-session-name: GitHubWordPressDeploy
          allowed-account-ids: '429552190319'
          retry-max-attempts: 3

      - name: Configure SSH
        if: steps.compare.outputs.build_required == 'true'
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > /dev/null

      - name: Allow temporary SSH access
        if: steps.compare.outputs.build_required == 'true'
        id: ssh_access
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP="$(curl -4 --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            https://checkip.amazonaws.com | tr -d '[:space:]')"

          python3 - "$RUNNER_IP" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4 or not address.is_global:
              raise SystemExit("Expected a public IPv4 address")
          PY

          RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --group-id sg-078e53f9aab04fd98 \
            --ip-permissions \
            "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=GitHub-CMS-${GITHUB_RUN_ID}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"

          test -n "$RULE_ID"
          test "$RULE_ID" != "None"
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload and activate website
        if: steps.compare.outputs.build_required == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          RELEASE="cms-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          CONTENT_HASH="$(node -p \
            "JSON.parse(require('fs').readFileSync('monitor-state/snapshot.json','utf8')).sha256")"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            website.tar.gz \
            "${TARGET}:/var/www/xpertsedge/releases/${RELEASE}.tar.gz"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            "$TARGET" \
            "bash -s -- '$RELEASE' '$GITHUB_SHA' '$CONTENT_HASH'" <<'REMOTE'
          set -euo pipefail

          RELEASE="$1"
          EXPECTED_SHA="$2"
          EXPECTED_CONTENT="$3"
          BASE=/var/www/xpertsedge
          umask 022

          mkdir "$BASE/releases/$RELEASE"

          tar -xzf "$BASE/releases/$RELEASE.tar.gz" \
            -C "$BASE/releases/$RELEASE"

          test -s "$BASE/releases/$RELEASE/index.html"
          test -s "$BASE/releases/$RELEASE/blog.html"

          test "$(cat "$BASE/releases/$RELEASE/deployment.txt")" = "$EXPECTED_SHA"
          test "$(cat "$BASE/releases/$RELEASE/cms-content.txt")" = "$EXPECTED_CONTENT"

          chmod -R u=rwX,go=rX "$BASE/releases/$RELEASE"

          PREVIOUS="$(readlink "$BASE/current" || true)"

          rollback() {
            if [ -n "$PREVIOUS" ]; then
              ln -sfn "$PREVIOUS" "$BASE/current-next"
              mv -Tf "$BASE/current-next" "$BASE/current"
            else
              rm -f "$BASE/current"
            fi
          }

          verify_release() {
            local ACTUAL_SHA
            local ACTUAL_CONTENT

            ACTUAL_SHA="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --resolve www.xpertsedgetech.com:443:127.0.0.1 \
              https://www.xpertsedgetech.com/deployment.txt)" || return 1

            ACTUAL_CONTENT="$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --resolve www.xpertsedgetech.com:443:127.0.0.1 \
              https://www.xpertsedgetech.com/cms-content.txt)" || return 1

            test "$ACTUAL_SHA" = "$EXPECTED_SHA" || return 1
            test "$ACTUAL_CONTENT" = "$EXPECTED_CONTENT" || return 1

            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --resolve www.xpertsedgetech.com:443:127.0.0.1 \
              https://www.xpertsedgetech.com/blog/ \
              -o /dev/null || return 1
          }

          ln -sfn "$BASE/releases/$RELEASE" "$BASE/current-next"
          mv -Tf "$BASE/current-next" "$BASE/current"

          if ! verify_release; then
            rollback
            echo "Website verification failed; previous release restored where available."
            exit 1
          fi

          rm -f "$BASE/releases/$RELEASE.tar.gz"
          REMOTE

      - name: Verify deployment from GitHub runner
        if: steps.compare.outputs.build_required == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_CONTENT="$(node -p \
            "JSON.parse(require('fs').readFileSync('monitor-state/snapshot.json','utf8')).sha256")"

          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 30 \
            --resolve "www.xpertsedgetech.com:443:${DEPLOY_HOST}" \
            https://www.xpertsedgetech.com/deployment.txt \
            -o deployed.txt

          test "$(cat deployed.txt)" = "$GITHUB_SHA"

          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 30 \
            --resolve "www.xpertsedgetech.com:443:${DEPLOY_HOST}" \
            https://www.xpertsedgetech.com/cms-content.txt \
            -o cms-deployed.txt

          test "$(cat cms-deployed.txt)" = "$EXPECTED_CONTENT"

          curl --fail --silent --show-error \
            --connect-timeout 20 --max-time 30 \
            --resolve "www.xpertsedgetech.com:443:${DEPLOY_HOST}" \
            https://www.xpertsedgetech.com/blog/ \
            -o /dev/null

      - name: Remove temporary SSH access
        if: always() && steps.ssh_access.outputs.rule_id != ''
        env:
          RULE_ID: ${{ steps.ssh_access.outputs.rule_id }}
        shell: bash
        run: |
          set -euo pipefail

          aws ec2 revoke-security-group-ingress \
            --group-id sg-078e53f9aab04fd98 \
            --security-group-rule-ids "$RULE_ID"

      - name: Remember verified CMS deployment
        if: success() && steps.compare.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xpertsedge-wp-ec2-deployed-snapshot
          path: monitor-state/snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: No content changes
        if: steps.compare.outputs.build_required == 'false'
        run: echo "WordPress content unchanged; deployment skipped."

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519