name: Deploy website and backend to EC2

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install website dependencies
        run: npx --yes pnpm@10 install --frozen-lockfile

      - name: Check TypeScript
        run: npx --yes pnpm@10 exec tsc --noEmit

      - name: Test WordPress monitoring
        run: node --test tests/*.test.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Build website
        env:
          NEXT_PUBLIC_LEADS_DB_ENABLED: 'false'
          NEXT_PUBLIC_LEADS_API_URL: '/api/leads'
        run: npx --yes pnpm@10 build

      - name: Package website and backend
        shell: bash
        run: |
          set -euo pipefail

          test -s out/index.html
          printf '%s\n' "$GITHUB_SHA" > out/deployment.txt
          tar -czf website.tar.gz -C out .

          test -s backend/src/server.js
          test -s backend/package-lock.json

          tar -czf backend.tar.gz -C backend \
            package.json package-lock.json src

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::429552190319:role/XpertsEdgeGitHubEC2DeployRole
          aws-region: ap-south-1
          role-session-name: GitHubEC2Deploy
          allowed-account-ids: '429552190319'
          retry-max-attempts: 3

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > /dev/null

      - name: Allow temporary SSH access
        id: ssh_access
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_IP="$(curl -4 --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            https://checkip.amazonaws.com | tr -d '[:space:]')"

          python3 - "$RUNNER_IP" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4 or not address.is_global:
              raise SystemExit("Expected a public IPv4 address")
          PY

          RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --group-id sg-078e53f9aab04fd98 \
            --ip-permissions \
            "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=GitHub-deploy-${GITHUB_RUN_ID}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)"

          test -n "$RULE_ID"
          test "$RULE_ID" != "None"
          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload deployment packages
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            website.tar.gz \
            "${TARGET}:/var/www/xpertsedge/releases/${RELEASE}.tar.gz"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            backend.tar.gz \
            "${TARGET}:/opt/xpertsedge-api/releases/${RELEASE}.tar.gz"

      - name: Deploy backend and check database readiness
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            "$TARGET" "bash -s -- '$RELEASE'" <<'REMOTE'
          set -euo pipefail

          RELEASE="$1"
          BASE=/opt/xpertsedge-api
          umask 022

          mkdir "$BASE/releases/$RELEASE"
          tar -xzf "$BASE/releases/$RELEASE.tar.gz" \
            -C "$BASE/releases/$RELEASE"

          cd "$BASE/releases/$RELEASE"
          test -s src/server.js
          npm ci --omit=dev --no-audit --no-fund

          PREVIOUS="$(readlink "$BASE/current" || true)"

          restore_previous() {
            if [ -n "$PREVIOUS" ]; then
              ln -sfn "$PREVIOUS" "$BASE/current-next"
              mv -Tf "$BASE/current-next" "$BASE/current"
              sudo -n /usr/bin/systemctl restart xpertsedge-api.service
            else
              echo "No previous backend release; inspect service logs."
            fi
          }

          ln -sfn "$BASE/releases/$RELEASE" "$BASE/current-next"
          mv -Tf "$BASE/current-next" "$BASE/current"

          if ! sudo -n /usr/bin/systemctl restart xpertsedge-api.service; then
            restore_previous
            exit 1
          fi

          HEALTHY=false

          for ATTEMPT in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --connect-timeout 3 --max-time 12 \
              http://127.0.0.1:3001/api/health/ready \
              -o /dev/null; then
              HEALTHY=true
              break
            fi

            echo "Waiting for backend readiness: attempt $ATTEMPT"
            sleep 3
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "Backend database readiness failed."
            restore_previous
            exit 1
          fi

          if ! curl --fail --silent --show-error \
            --connect-timeout 3 --max-time 15 \
            -H 'Host: xpertsedgetech.com' \
            http://127.0.0.1/api/health \
            -o /dev/null; then
            restore_previous
            exit 1
          fi

          rm -f "$BASE/releases/$RELEASE.tar.gz"
          echo "Backend and database connection checks passed."
          REMOTE

      - name: Activate website
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectionAttempts=3 -o ConnectTimeout=20 \
            "$TARGET" \
            "bash -s -- '$RELEASE' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail

          RELEASE="$1"
          EXPECTED_SHA="$2"
          BASE=/var/www/xpertsedge
          umask 022

          mkdir "$BASE/releases/$RELEASE"
          tar -xzf "$BASE/releases/$RELEASE.tar.gz" \
            -C "$BASE/releases/$RELEASE"

          test -s "$BASE/releases/$RELEASE/index.html"
          test "$(cat "$BASE/releases/$RELEASE/deployment.txt")" = "$EXPECTED_SHA"

          chmod -R u=rwX,go=rX "$BASE/releases/$RELEASE"
          PREVIOUS="$(readlink "$BASE/current" || true)"

          rollback() {
            if [ -n "$PREVIOUS" ]; then
              ln -sfn "$PREVIOUS" "$BASE/current-next"
              mv -Tf "$BASE/current-next" "$BASE/current"
            else
              rm -f "$BASE/current"
            fi
          }

          ln -sfn "$BASE/releases/$RELEASE" "$BASE/current-next"
          mv -Tf "$BASE/current-next" "$BASE/current"

          if ! ACTUAL_SHA="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'Host: xpertsedgetech.com' \
            http://127.0.0.1/deployment.txt)"; then
            rollback
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            rollback
            exit 1
          fi

          rm -f "$BASE/releases/$RELEASE.tar.gz"
          REMOTE

      - name: Verify EC2 public deployment
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 2 \
            --connect-timeout 20 --max-time 30 \
            "http://${DEPLOY_HOST}/deployment.txt" \
            -o deployed.txt

          test "$(cat deployed.txt)" = "$GITHUB_SHA"

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            "http://${DEPLOY_HOST}/api/health"

      - name: Remove temporary SSH access
        if: always() && steps.ssh_access.outputs.rule_id != ''
        env:
          RULE_ID: ${{ steps.ssh_access.outputs.rule_id }}
        shell: bash
        run: |
          set -euo pipefail

          aws ec2 revoke-security-group-ingress \
            --group-id sg-078e53f9aab04fd98 \
            --security-group-rule-ids "$RULE_ID"

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519