name: Deploy website to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npx --yes pnpm@10 install --frozen-lockfile

      - name: Check TypeScript
        run: npx --yes pnpm@10 exec tsc --noEmit

      - name: Test WordPress monitoring
        run: node --test tests/*.test.mjs

      - name: Build website
        env:
          NEXT_PUBLIC_LEADS_DB_ENABLED: 'false'
        run: npx --yes pnpm@10 build

      - name: Package website
        run: |
          set -euo pipefail
          test -s out/index.html
          printf '%s\n' "$GITHUB_SHA" > out/deployment.txt
          tar -czf website.tar.gz -C out .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and activate website
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          RELEASE="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 website.tar.gz \
            "${TARGET}:/var/www/xpertsedge/releases/${RELEASE}.tar.gz"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "$TARGET" \
            "bash -s -- '$RELEASE' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          RELEASE="$1"
          EXPECTED_SHA="$2"
          BASE=/var/www/xpertsedge
          umask 022

          mkdir "$BASE/releases/$RELEASE"
          tar -xzf "$BASE/releases/$RELEASE.tar.gz" \
            -C "$BASE/releases/$RELEASE"

          test -s "$BASE/releases/$RELEASE/index.html"
          test "$(cat "$BASE/releases/$RELEASE/deployment.txt")" = "$EXPECTED_SHA"
          chmod -R u=rwX,go=rX "$BASE/releases/$RELEASE"

          PREVIOUS="$(readlink "$BASE/current" || true)"

          rollback() {
            if [ -n "$PREVIOUS" ]; then
              ln -sfn "$PREVIOUS" "$BASE/current-next"
              mv -Tf "$BASE/current-next" "$BASE/current"
            else
              rm -f "$BASE/current"
            fi
          }

          ln -sfn "$BASE/releases/$RELEASE" "$BASE/current-next"
          mv -Tf "$BASE/current-next" "$BASE/current"

          if ! ACTUAL_SHA="$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -H 'Host: xpertsedgetech.com' \
            http://127.0.0.1/deployment.txt)"; then
            rollback
            exit 1
          fi

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            rollback
            exit 1
          fi

          rm -f "$BASE/releases/$RELEASE.tar.gz"
          REMOTE

      - name: Verify EC2 public deployment
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 2 \
            --connect-timeout 20 --max-time 30 \
            "http://${DEPLOY_HOST}/deployment.txt" \
            -o deployed.txt

          test "$(cat deployed.txt)" = "$GITHUB_SHA"

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519