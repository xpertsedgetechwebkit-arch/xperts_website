<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-label="Temporary technology training illustration">

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e8eee9"/>
    <stop offset="1" stop-color="#b9cfbf"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#173438"/>
    <stop offset="1" stop-color="#0b1721"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" x2="1" y1="0" y2="0">
    <stop stop-color="#957159"/>
    <stop offset="1" stop-color="#bd9270"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22c55e"/>
    <stop offset="1" stop-color="#84cc16"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#11201c" flood-opacity=".18"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity=".18"/>
  </pattern>
</defs>

<rect width="1200" height="960" fill="url(#wall)"/>
<rect width="1200" height="960" fill="url(#dots)"/>

<!-- Instructor-led learning room -->
<rect x="0" y="655" width="1200" height="305" fill="#5b726b"/>
<path d="M0 659 1200 633" stroke="#cadfd3" stroke-width="10"/>
<rect x="104" y="68" width="656" height="458" rx="27" fill="#f0fcf3" filter="url(#shadow)"/>
<rect x="133" y="100" width="598" height="385" rx="13" fill="url(#screen)"/>
<!-- diagram / coding tutorial on display -->
<g stroke="#8de2b1" stroke-width="11" stroke-linecap="round"><path d="M175 160h175"/><path d="M199 198h286"/><path d="M199 237h204"/></g>
<g stroke="#b5a0d9" stroke-width="10" stroke-linecap="round"><path d="M175 301h113"/><path d="M323 301h209"/><path d="M199 343h240"/></g>
<g stroke="#e6aa86" stroke-width="10" stroke-linecap="round"><path d="M175 406h96"/><path d="M294 406h164"/></g>
<path d="M648 52h266l-50 56H648Z" fill="#f0e5dc" opacity=".55"/>
<!-- Instructor -->
<ellipse cx="943" cy="232" rx="76" ry="87" fill="#a56347"/>
<path d="M861 229q-12-110 83-112 104 0 81 118-31-57-63-66-37 46-101 60Z" fill="#29262d"/>
<path d="M853 352q21-60 82-68 67 0 95 70l39 276H815Z" fill="#2d555b"/>
<path d="M852 377q-76 13-122 98" stroke="#a56347" stroke-width="36" fill="none" stroke-linecap="round"/>
<path d="M724 475l-57-35" stroke="#a56347" stroke-width="25" fill="none" stroke-linecap="round"/>
<path d="M1012 370q82 81 99 164" stroke="#a56347" stroke-width="38" fill="none" stroke-linecap="round"/>
<!-- Desks -->
<rect x="68" y="650" width="1090" height="70" rx="22" fill="url(#desk)" filter="url(#shadow)"/>
<!-- Foreground learners -->
<circle cx="298" cy="589" r="82" fill="#b57b59"/>
<path d="M217 600q-9-114 89-117 97-4 76 111-42-37-75-56-36 39-90 62Z" fill="#292932"/>
<path d="M157 820q20-155 140-154 129 0 164 154Z" fill="#4e7785"/>
<circle cx="573" cy="619" r="71" fill="#8b543e"/>
<path d="M506 628q-9-91 64-97 77-6 75 93-35-33-73-47-25 38-66 51Z" fill="#251f22"/>
<path d="M451 811q17-124 125-125 119 0 150 125Z" fill="#bb8f77"/>
<!-- small open laptop on desk -->
<path d="M779 567h200l19 119H763Z" fill="#293440"/>
<path d="M800 587h159l11 79H788Z" fill="#1d4341"/>
<path d="M759 687h262l14 16H742Z" fill="#414e59"/>
<path d="M820 608h64M820 626h117M820 644h84" stroke="#94e3c0" stroke-width="6" stroke-linecap="round"/>
<!-- light -->
<circle cx="1092" cy="108" r="61" fill="#b3ecc1" opacity=".34"/>

</svg>
