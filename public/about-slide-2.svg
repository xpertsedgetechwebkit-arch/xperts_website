<path d="M0 686 1200 670v290H0Z" fill="#607b68"/>
<rect x="511" y="84" width="582" height="372" rx="20" fill="#e9f8ef" filter="url(#shadow)"/>
<rect x="542" y="113" width="519" height="308" rx="11" fill="url(#screen)"/>
<!-- Code editor -->
<circle cx="566" cy="140" r="7" fill="#ef6964"/>
<circle cx="591" cy="140" r="7" fill="#ffd36a"/>
<circle cx="616" cy="140" r="7" fill="#22c55e"/>
