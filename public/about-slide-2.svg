<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-label="Temporary technology training illustration">

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4e7"/>
    <stop offset="1" stop-color="#a5d4bd"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#173438"/>
    <stop offset="1" stop-color="#0b1721"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" x2="1" y1="0" y2="0">
    <stop stop-color="#957159"/>
    <stop offset="1" stop-color="#bd9270"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22c55e"/>
    <stop offset="1" stop-color="#84cc16"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#11201c" flood-opacity=".18"/>
  </filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity=".18"/>
  </pattern>
</defs>

<rect width="1200" height="960" fill="url(#wall)"/>
<rect width="1200" height="960" fill="url(#dots)"/>

<!-- Modern training lab: ambient windows and architectural details -->
<rect x="72" y="78" width="294" height="393" rx="19" fill="#f8fffa" opacity=".86"/>
<rect x="88" y="97" width="261" height="357" rx="11" fill="#d0ede6"/>
